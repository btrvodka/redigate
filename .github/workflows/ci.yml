name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: OpenAPI specification is up to date
        run: make swagger && git diff --exit-code -- internal/httpapi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  integration:
    name: integration (${{ matrix.image }}, RESP${{ matrix.protocol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [redis:7.4, redis:8, valkey/valkey:8]
        protocol: [3]
        include:
          - image: redis:8
            protocol: 2
    steps:
      - uses: actions/checkout@v7
      - run: make test-integration
        env:
          REDIS_IMAGE: ${{ matrix.image }}
          REDIS_PROTOCOL: ${{ matrix.protocol }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
