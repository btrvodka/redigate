  /command:
    post:
      consumes:
      - application/json
      - text/plain
      description: |-
        Runs any command. The body is either JSON (CommandRequest) or a redis-cli style command line such as `SET key "a value"`.
        Commands changing connection state (SELECT, AUTH, HELLO, MULTI, WATCH, CLIENT REPLY, ...) run on a dedicated connection.
        SUBSCRIBE, MONITOR and SYNC are served by streaming endpoints. With a fan-out target (masters, replicas, all, sentinels) the result is service.FanOutResult.
      parameters:
      - description: JSON or a command line
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CommandRequest'
      - description: Node address
        in: query
        name: node
        type: string
      - description: masters, replicas, all or sentinels
        in: query
        name: target
        type: string
      - description: Database
        in: query
        name: db
        type: integer
      - description: auto, utf8 or base64
        in: query
        name: encoding
        type: string
      - description: Timeout for blocking commands, e.g. 30s
        in: query
        name: timeout
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.Response'
            - properties:
                result:
                  $ref: '#/definitions/service.CommandResult'
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Run a command
      tags:
      - general
