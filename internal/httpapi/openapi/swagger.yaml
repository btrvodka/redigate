      - description: JSON or command lines
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.PipelineRequest'
      - description: Node address
        in: query
        name: node
        type: string
      - description: Database
        in: query
        name: db
        type: integer
      - description: MULTI/EXEC
        in: query
        name: atomic
        type: boolean
      - description: Dedicated connection
        in: query
        name: session
        type: boolean
      - description: auto, utf8 or base64
        in: query
