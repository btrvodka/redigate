info:
  contact: {}
  description: |-
    HTTP API for Redis and Valkey: standalone, cluster and sentinel.

    Every JSON response is wrapped into Response; errors use ErrorResponse with a stable error_code.

    Common query parameters (where they make sense):
    db - database (standalone and sentinel);
    node - send the request to the node with this address;
    target - auto (by key), node, masters, replicas, all or sentinels; fan-out targets return a result per node;
    encoding - auto (binary strings become {"base64": "..."}), utf8 or base64;
    key_encoding=base64 - keys, fields and members in the query string are base64;
    timeout - request timeout for blocking commands, e.g. 30s;
    duration - duration of streams, exports and imports;
    pretty - indented JSON.

    In request bodies keys and values are strings, numbers or {"base64": "..."} objects.
  license:
    name: MIT
  title: redigate API
  version: "1.0"
paths:
  /acl/categories:
    get:
      description: ACL CAT.
      parameters:
      - description: Category to list commands of
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.Response'
            - properties:
                result:
                  $ref: '#/definitions/service.CommandResult'
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ACL categories
      tags:
      - acl
  /acl/dryrun:
    post:
      description: 'ACL DRYRUN: "OK" or the reason of the denial.'
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ACLDryRunRequest'
      - description: Node address
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.Response'
            - properties:
                result:
                  $ref: '#/definitions/service.CommandResult'
              type: object
        default:
          description: ""
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check a permission
      tags:
      - acl
  /acl/genpass:
    get:
      description: ACL GENPASS.
      parameters:
      - description: Bits
        in: query
        name: bits
        type: integer
      produces:
      - application/json
