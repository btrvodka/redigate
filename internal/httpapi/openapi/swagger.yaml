basePath: /api/v1
definitions:
  httpapi.ACLDryRunRequest:
    properties:
      command:
        description: Command and arguments.
        items:
          type: string
        type: array
      user:
        description: User name.
        type: string
    type: object
  httpapi.ACLSetUserRequest:
    properties:
      reset:
        description: Reset the user before applying the rules.
        type: boolean
      rules:
        description: ACL rules such as on, >password, ~keys:*, +@read.
        items:
          type: string
        type: array
    type: object
  httpapi.BitmapOpRequest:
    properties:
      destination:
        description: Destination key.
        type: string
      keys:
        description: Keys.
        items:
          type: string
        type: array
      op:
        description: Operation.
        enum:
        - and
        - or
        - xor
        - not
        - diff
        - diff1
        - andor
        - one
        type: string
    type: object
  httpapi.BitmapSetBitRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      offset:
        description: Offset.
        type: integer
      value:
        description: Bit value.
        enum:
        - 0
        - 1
        type: integer
    type: object
  httpapi.BloomReserveRequest:
    properties:
      capacity:
        description: Expected number of items.
        type: integer
      error_rate:
        description: False positive rate, e.g. 0.01.
        type: number
      expansion:
        description: Growth factor of sub-filters.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      nonscaling:
        description: Do not add sub-filters when full.
        type: boolean
    type: object
  httpapi.CMSInitRequest:
    properties:
      depth:
        description: Depth.
        type: integer
      error:
        description: Estimation error, with probability, alternative to width and
          depth.
        type: number
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      probability:
        description: Probability of exceeding the error.
        type: number
      width:
        description: Counters per row, with depth.
        type: integer
    type: object
  httpapi.ClientKillRequest:
    properties:
      filters:
        additionalProperties:
          type: string
        description: 'CLIENT KILL filters: id, addr, laddr, user, type, skipme, maxage.'
        type: object
    type: object
  httpapi.ClientPauseRequest:
    properties:
      mode:
        description: Pause writes only or all commands.
        enum:
        - write
        - all
        type: string
      timeout_ms:
        description: Pause duration in milliseconds.
        type: integer
    type: object
  httpapi.ClusterFailoverRequest:
    properties:
      mode:
        description: Failover mode, empty for a coordinated failover.
        enum:
        - force
        - takeover
        type: string
    type: object
  httpapi.ClusterForgetRequest:
    properties:
      node_id:
        description: Cluster node id.
        type: string
    type: object
  httpapi.ClusterMeetRequest:
    properties:
      bus_port:
        description: Cluster bus port, port+10000 by default.
        type: integer
      ip:
        description: IP address.
        type: string
      port:
        description: Port.
        type: integer
    type: object
  httpapi.ClusterReplicateRequest:
    properties:
      master_id:
        description: Master node id.
        type: string
    type: object
  httpapi.ClusterResetRequest:
    properties:
      hard:
        description: 'HARD reset: also forget the node id and epochs.'
        type: boolean
    type: object
  httpapi.ClusterSetSlotRequest:
    properties:
      node_id:
        description: Node id for importing, migrating and node.
        type: string
      slot:
        description: Slot.
        type: integer
      state:
        description: Slot state.
        enum:
        - importing
        - migrating
        - stable
        - node
        type: string
    type: object
  httpapi.ClusterSlotsRequest:
    properties:
      ranges:
        description: Slot ranges [first, last], alternative to slots.
        items:
          items:
            type: integer
          type: array
        type: array
      slots:
        description: Slots.
        items:
          type: integer
        type: array
    type: object
  httpapi.CommandRequest:
    properties:
      args:
        description: 'Command and arguments: strings, numbers or {"base64": "..."}.'
        items: {}
        type: array
      command:
        description: A redis-cli style command line, alternative to args.
        type: string
      db:
        description: Database (standalone and sentinel).
        type: integer
      encoding:
        description: Encoding of binary strings in the reply.
        enum:
        - auto
        - utf8
        - base64
        type: string
      node:
        description: Node address for target=node.
        type: string
      target:
        description: 'Where the command goes: auto routes by key.'
        enum:
        - auto
        - node
        - masters
        - replicas
        - all
        - sentinels
        type: string
    type: object
  httpapi.ConfigSetRequest:
    properties:
      params:
        additionalProperties:
          type: string
        description: Parameters and values.
        type: object
    type: object
  httpapi.CountRequest:
    properties:
      count:
        description: Number of elements.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.CuckooAddRequest:
    properties:
      items:
        description: Items.
        items:
          type: string
        type: array
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      nx:
        description: Add only absent items (CF.INSERTNX).
        type: boolean
    type: object
  httpapi.CuckooItemRequest:
    properties:
      item:
        description: 'Item. A string, a number or {"base64": "..."}.'
        type: string
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.CuckooReserveRequest:
    properties:
      bucket_size:
        description: Items per bucket.
        type: integer
      capacity:
        description: Capacity.
        type: integer
      expansion:
        description: Growth factor of sub-filters.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      max_iterations:
        description: Swap attempts before declaring the filter full.
        type: integer
    type: object
  httpapi.ErrorResponse:
    properties:
      error_code:
        example: BAD_REQUEST
        type: string
      error_description:
        example: key is required
        type: string
      request_id:
        example: 6f1c2a9e0b7d4c3f8a5e1d2b3c4f5a6b
        type: string
    type: object
  httpapi.EvalRequest:
    properties:
      args:
        description: Arguments.
        items:
          type: string
        type: array
      keys:
        description: 'Keys: they route the call in cluster.'
        items:
          type: string
        type: array
      read_only:
        description: Use the read-only variant of the command.
        type: boolean
      script:
        description: Lua script, alternative to sha.
        type: string
      sha:
        description: SHA1 of a loaded script.
        type: string
    type: object
  httpapi.FieldValue:
    properties:
      field:
        description: 'Field. A string, a number or {"base64": "..."}.'
        type: string
      value:
        description: 'Value. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.FunctionCallRequest:
    properties:
      args:
        description: Arguments.
        items:
          type: string
        type: array
      function:
        description: Function name.
        type: string
      keys:
        description: Keys.
        items:
          type: string
        type: array
      read_only:
        description: Use the read-only variant of the command.
        type: boolean
    type: object
  httpapi.FunctionLoadRequest:
    properties:
      code:
        description: 'Library code starting with #!lua name=<library>.'
        type: string
      replace:
        description: Overwrite existing data.
        type: boolean
    type: object
  httpapi.FunctionRestoreRequest:
    properties:
      dump:
        description: Dump from GET /functions/dump.
        type: string
      policy:
        description: Restore policy, append by default.
        enum:
        - append
        - replace
        - flush
        type: string
    type: object
  httpapi.GeoAddRequest:
    properties:
      ch:
        description: Return the number of changed elements.
        type: boolean
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      members:
        description: Members.
        items:
          $ref: '#/definitions/httpapi.GeoMember'
        type: array
      nx:
        description: Only if the key or the element does not exist.
        type: boolean
      xx:
        description: Only if the key or the element exists.
        type: boolean
    type: object
  httpapi.GeoMember:
    properties:
      latitude:
        description: Latitude.
        type: number
      longitude:
        description: Longitude.
        type: number
      member:
        description: 'Member. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.GeoSearchRequest:
    properties:
      any:
        description: Return as soon as count matches are found.
        type: boolean
      count:
        description: Number of elements.
        type: integer
      destination:
        description: Store the result (GEOSEARCHSTORE).
        type: string
      from_member:
        description: 'Center: an existing member.'
        type: string
      height:
        description: Box height, with width.
        type: number
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      latitude:
        description: Center latitude, with longitude.
        type: number
      longitude:
        description: Center longitude, with latitude.
        type: number
      radius:
        description: Search in a circle.
        type: number
      sort:
        description: Order by distance.
        enum:
        - asc
        - desc
        type: string
      store_dist:
        description: Store distances as scores.
        type: boolean
      unit:
        description: Distance unit, m by default.
        enum:
        - m
        - km
        - ft
        - mi
        type: string
      width:
        description: Search in a box, with height.
        type: number
      with_coord:
        description: Return coordinates.
        type: boolean
      with_dist:
        description: Return distances.
        type: boolean
      with_hash:
        description: Return geohashes.
        type: boolean
    type: object
  httpapi.HLLAddRequest:
    properties:
      elements:
        description: Elements.
        items:
          type: string
        type: array
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.HLLMergeRequest:
    properties:
      destination:
        description: Destination key.
        type: string
      keys:
        description: Keys.
        items:
          type: string
        type: array
    type: object
  httpapi.HashIncrRequest:
    properties:
      by:
        description: Increment, 1 by default; a fractional value uses HINCRBYFLOAT.
        type: number
      field:
        description: 'Field. A string, a number or {"base64": "..."}.'
        type: string
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.HashSetRequest:
    properties:
      fields:
        description: Fields.
        items:
          $ref: '#/definitions/httpapi.FieldValue'
        type: array
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      nx:
        description: 'HSETNX: set a single field only if it does not exist.'
        type: boolean
    type: object
  httpapi.HashTTLRequest:
    properties:
      condition:
        description: Expiration condition.
        enum:
        - NX
        - XX
        - GT
        - LT
        type: string
      fields:
        description: Fields.
        items:
          type: string
        type: array
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      ttl_ms:
        description: TTL in milliseconds.
        type: integer
    type: object
  httpapi.IncrRequest:
    properties:
      by:
        description: Increment, 1 by default; a fractional value uses INCRBYFLOAT.
        type: number
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.ItemIncrement:
    properties:
      increment:
        description: Increment.
        type: integer
      item:
        description: 'Item. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.ItemIncrementsRequest:
    properties:
      items:
        description: Items.
        items:
          $ref: '#/definitions/httpapi.ItemIncrement'
        type: array
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.ItemsRequest:
    properties:
      items:
        description: Items.
        items:
          type: string
        type: array
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.JSONArrayRequest:
    properties:
      index:
        description: 'Array index: required by arrinsert, the last element for arrpop
          by default.'
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      path:
        description: JSONPath, $ by default.
        type: string
      values:
        description: JSON values.
        items:
          type: object
        type: array
    type: object
  httpapi.JSONNumIncrRequest:
    properties:
      by:
        description: Increment, 1 by default.
        type: number
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      path:
        description: JSONPath, $ by default.
        type: string
    type: object
  httpapi.JSONPathRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      path:
        description: JSONPath, $ by default.
        type: string
    type: object
  httpapi.JSONSetRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      nx:
        description: Only if the key or the element does not exist.
        type: boolean
      path:
        description: JSONPath, $ by default.
        type: string
      value:
        description: Any JSON value.
        type: object
      xx:
        description: Only if the key or the element exists.
        type: boolean
    type: object
  httpapi.KeyCopyRequest:
    properties:
      destination:
        description: Destination key.
        type: string
      destination_db:
        description: Database of the destination.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      replace:
        description: Overwrite existing data.
        type: boolean
    type: object
  httpapi.KeyRenameRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      new_key:
        description: New key name.
        type: string
      nx:
        description: 'RENAMENX: only if the new key does not exist.'
        type: boolean
    type: object
  httpapi.KeyRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.KeyRestoreRequest:
    properties:
      absttl:
        description: ttl_ms is an absolute Unix time in milliseconds.
        type: boolean
      dump:
        description: Serialized value from GET /keys/dump.
        type: string
      frequency:
        description: LFU frequency.
        type: integer
      idle_seconds:
        description: LRU idle time.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      replace:
        description: Overwrite existing data.
        type: boolean
      ttl_ms:
        description: TTL in milliseconds, 0 for none.
        type: integer
    type: object
  httpapi.KeyTTLRequest:
    properties:
      condition:
        description: Expiration condition.
        enum:
        - NX
        - XX
        - GT
        - LT
        type: string
      expire_at_ms:
        description: Absolute expiration time, Unix milliseconds.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      ttl_ms:
        description: TTL in milliseconds.
        type: integer
    type: object
  httpapi.KeyValue:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      value:
        description: 'Value. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.KeysDeleteRequest:
    properties:
      cursor:
        description: Cursor of a previous incomplete request.
        type: string
      dry_run:
        description: Count matching keys without deleting them.
        type: boolean
      match:
        description: Glob pattern, required.
        type: string
      type:
        description: Delete only keys of this type.
        type: string
    type: object
  httpapi.KeysOpRequest:
    properties:
      destination:
        description: Store the result into this key.
        type: string
      keys:
        description: Keys.
        items:
          type: string
        type: array
    type: object
  httpapi.ListInsertRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      pivot:
        description: Existing element.
        type: string
      position:
        description: Insert before or after the pivot.
        enum:
        - before
        - after
        type: string
      value:
        description: 'Value. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.ListMoveRequest:
    properties:
      block_ms:
        description: Block for up to this many milliseconds waiting for data; pass
          ?timeout accordingly.
        type: integer
      destination:
        description: Destination key.
        type: string
      from:
        description: Pop from this end, left by default.
        enum:
        - left
        - right
        type: string
      source:
        description: Source key.
        type: string
      to:
        description: Push to this end, left by default.
        enum:
        - left
        - right
        type: string
    type: object
  httpapi.ListPopRequest:
    properties:
      block_ms:
        description: Block for up to this many milliseconds waiting for data; pass
          ?timeout accordingly.
        type: integer
      count:
        description: Number of elements.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      side:
        description: List end, left by default.
        enum:
        - left
        - right
        type: string
    type: object
  httpapi.ListPushRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      only_existing:
        description: Push only to an existing list (LPUSHX/RPUSHX).
        type: boolean
      side:
        description: List end, left by default.
        enum:
        - left
        - right
        type: string
      values:
        description: 'Values: strings, numbers or {"base64": "..."}.'
        items:
          type: string
        type: array
    type: object
  httpapi.ListRemoveRequest:
    properties:
      count:
        description: 'Occurrences to remove: 0 for all, negative from the tail.'
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      value:
        description: 'Value. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.ListSetRequest:
    properties:
      index:
        description: Index.
        type: integer
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      value:
        description: 'Value. A string, a number or {"base64": "..."}.'
        type: string
    type: object
  httpapi.ListTrimRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      start:
        description: Start index.
        type: integer
      stop:
        description: Stop index.
        type: integer
    type: object
  httpapi.MembersRequest:
    properties:
      key:
        description: 'Key. A string, a number or {"base64": "..."}.'
        type: string
      members:
        description: Members.
        items:
          type: string
        type: array
    type: object
  httpapi.MergeRequest:
    properties:
      destination:
        description: Destination key.
        type: string
      sources:
        description: Source keys.
        items:
          type: string
        type: array
      weights:
        description: Weights of sources.
        items:
          type: integer
        type: array
    type: object
  httpapi.PipelineRequest:
    properties:
      atomic:
        description: Wrap the commands into MULTI/EXEC.
        type: boolean
      commands:
        description: 'Commands: arrays of arguments or command lines.'
        items:
          items: {}
          type: array
        type: array
      db:
        description: Database (standalone and sentinel).
        type: integer
      encoding:
        description: Encoding of binary strings in the reply.
        enum:
        - auto
        - utf8
        - base64
        type: string
      node:
        description: Node address for target=node.
        type: string
      session:
        description: 'Run on a dedicated connection: SELECT, AUTH, WATCH and MULTI
          are allowed.'
        type: boolean
      target:
        description: 'Where the command goes: auto routes by key.'
        enum:
        - auto
        - node
        - masters
        - replicas
        - all
        - sentinels
        type: string
    type: object
  httpapi.PublishRequest:
    properties:
      channel:
        description: 'Channel. A string, a number or {"base64": "..."}.'
        type: string
      message:
        description: 'Message. A string, a number or {"base64": "..."}.'
        type: string
      sharded:
        description: Use SPUBLISH.
        type: boolean
    type: object
  httpapi.ReplicaOfRequest:
    properties:
      host:
        description: Host.
        type: string
      no_one:
        description: Make the node a master.
        type: boolean
      port:
        description: Port.
        type: integer
    type: object
  httpapi.Response:
    properties:
      error_code:
        description: Code is "OK" on success or an error code.
        example: OK
        type: string
      error_description:
        example: ""
        type: string
      request_id:
        example: 6f1c2a9e0b7d4c3f8a5e1d2b3c4f5a6b
        type: string
      result: {}
    type: object
  httpapi.SchemaField:
    properties:
      as:
        description: Alias.
        type: string
      field:
        description: Attribute name or JSONPath.
        type: string
      options:
        description: Extra field options, e.g. SORTABLE or vector parameters.
        items:
          type: string
        type: array
      type:
        description: Field type.
        enum:
        - text
        - tag
        - numeric
        - geo
        - vector
        - geoshape
        type: string
    type: object
  httpapi.ScoredMember:
    properties:
      member:
        description: 'Member. A string, a number or {"base64": "..."}.'
        type: string
      score:
        description: 'Score: a number or "inf", "-inf".'
        type: number
    type: object
  httpapi.ScriptLoadRequest:
    properties:
      script:
        description: Lua script.
        type: string
    type: object
  httpapi.SearchAggregateRequest:
    properties:
      args:
        description: Aggregation pipeline, e.g. ["GROUPBY", "1", "@city", "REDUCE",
          "COUNT", "0", "AS", "n"].
        items:
          type: string
        type: array
      dialect:
        description: Query dialect.
        type: integer
      params:
        additionalProperties:
          type: string
        description: Query parameters referenced as $name, values may be binary (vectors).
        type: object
      query:
        description: Query, * by default.
        type: string
    type: object
  httpapi.SearchAliasRequest:
    properties:
      alias:
        description: Alias.
        type: string
      index:
        description: Index.
        type: string
    type: object
  httpapi.SearchCreateIndexRequest:
    properties:
      args:
        description: Other FT.CREATE options placed before SCHEMA.
        items:
          type: string
        type: array
      filter:
        description: Filter expression for documents.
        type: string
      index:
        description: Index.
        type: string
      language:
        description: Default language for stemming.
        type: string
      "on":
        description: Indexed data type, hash by default.
        enum:
        - hash
        - json
        type: string
      prefixes:
        description: Key prefixes to index.
        items:
